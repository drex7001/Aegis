# Aegis ontology — THE declarative domain artifact (speckit Article XI, spec 01).
# Validators, FGA types, and UI screens derive from this file; DB vocabulary is
# validated against it at write time, never as DDL (ADR-013).
#
# Since P3 T30 this file is a **composition manifest** (spec 08 §2, ADR-037):
# the vocabulary lives in the modules listed below, and this is the artifact
# that names them, pins their versions, and carries the version claims stamp.
# It is still the single artifact Article XI names — the ontology is now a
# composition, not a second file.
#
# The `version` below is the **composition** version. `claim.ontology_version`
# and `edge_projection.ontology_version` store it, so every value ever stamped
# keeps its meaning; per-module versions are recorded in the release metadata.
#
# Versioning: patch = display/docs, minor = additive, major = rename/remove
# (requires migration + copy in ontology/history/). The composition's class is
# the strongest class among its modules' changes plus its own manifest changes.

version: 1.6.1   # patch: display labels on `person.nic`, `phone_number.number`
                 # and `has_nic` (T42, proposal 005).  Spec 01 §4 classes
                 # display hints as a patch, and nothing else moved: no name was
                 # added, removed or retyped, and every claim stamped 1.6.0
                 # means exactly what it meant.  The labels exist because the
                 # generator's default humanization renders `nic` as "Nic"
                 # (ADR-043), and a label declared here is fixed by a proposal
                 # rather than by editing React.
                 #
                 # 1.6.0: minor — the `controls` predicate, targeting the `party`
                 # interface (T39, proposal 004).  The first ontology change to
                 # run the workflow forwards rather than being backfilled, and
                 # the first shipped predicate whose endpoint is an interface.
                 #
                 # 1.5.0: action parameters, submission criteria and side-effect
                 # declarations (T34, ADR-040).  Additive — no action, role or
                 # dual-control rule changed, and the parameters describe the
                 # request contract that already existed.
                 #
                 # The composition bumps because a module did: spec 08 §7.4
                 # makes the composition's class the strongest among its
                 # modules' changes plus its own manifest changes, and this
                 # manifest now pins platform 1.2.0.  A claim stamped 1.4.0 and
                 # one stamped 1.5.0 were recorded under different action
                 # contracts, so they must not carry the same version.
                 #
                 # 1.4.0: shared properties + interfaces (T32, ADR-041).
                 # Additive — `party` and `identifiable` are new, and the three
                 # properties that became `shared:` references resolve to the
                 # same type and sensitivity they already had.
                 #
                 # 1.3.0: modularization (T30, ADR-037).  Pure reorganization —
                 # the composed registry is unchanged section for section, so
                 # nothing was added, removed, renamed or retyped.
                 #
                 # 1.2.0: additive `born_on` — ER treats a date-of-birth conflict
                 # as negative evidence, and no predicate could carry the
                 # declared person.date_of_birth property (T19, spec 05 §3.2).
                 #
                 # 1.1.0: additive identifier predicates + the `identifier` flag
                 # the deterministic ER rules key off (T18, spec 05 §3.1).
                 #
                 # 1.0.0 was major: `merged_into` removed (T17, ADR-028 §5) — merge
                 # lineage is ledger metadata, not a claim, because a claim requires a
                 # source record (Article I) and administrative metadata has
                 # none.  Migration 0007 ships with the removal and the prior
                 # version is archived in ontology/history/aegis-0.4.0.yaml
                 # (spec 01 §4).  No rows existed: nothing ever wrote it.
namespace: aegis.lk

# Authored, not derived (spec 08 §7.2): which proposal justified this bump and
# what class it claims. `aegis ontology check-release` fails CI when either is
# missing, when the proposal file does not exist, or when the diff against the
# previous released artifact is stronger than the class declared here.
release:
  proposal: 005-display-labels
  compatibility: patch

composition:
  # Platform first by convention, not by requirement — the loader resolves
  # imports rather than reading top to bottom. It owns the governance
  # vocabulary every domain module imports.
  - module: platform
    path: modules/platform.yaml
    version: "1.2.1"

  # The first domain module. A second domain is added by appending an entry
  # here and writing its file; no code under `aegis/` changes (Article XIV,
  # proved executably by tests/fixtures/ontology/border-cargo.yaml).
  - module: criminal_network
    path: modules/criminal-network.yaml
    version: "1.2.1"
    enabled: true
