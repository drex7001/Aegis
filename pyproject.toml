[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.6.0"
description = "Aegis — ontology-driven, governed intelligence platform core (see speckit/)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "minio>=7.2",
    "fastapi>=0.115",
    # Multipart parsing for the file-upload landing route (T23a). FastAPI
    # imports it lazily and raises at route-definition time without it.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "slowapi>=0.1.10",
    # Projection cell detection lives in aegis.analytics.clustering (vendored
    # out of the quarantine by T21, H-36). networkx is the pure-python fallback
    # that guarantees `aegis projections rebuild` works from the wheel alone,
    # without the optional C-extension leiden backend below.
    "networkx>=3",
    # Derivative stage (spec 04 §1 stage 3): PDF → text. Reimplemented in
    # aegis.ingestion.derivatives rather than imported from legacy/ — the
    # quarantine is replaced, never extended (ADR-023).
    "pdfplumber>=0.11",
    # Probabilistic entity resolution (spec 05 §3.2, T19). DuckDB is Splink's
    # local backend; unidecode + jellyfish give the transliteration and
    # phonetic keys that make cross-script names comparable without PyICU,
    # whose wheels are unreliable on the platforms this runs on.
    "splink>=4.0",
    "duckdb>=1.0",
    "unidecode>=1.3",
    "jellyfish>=1.0",
]

[project.optional-dependencies]
# python-igraph + leidenalg give true multiplex Leiden (aegis.analytics.clustering
# prefers them, falls back to networkx Louvain when absent). In dev/CI so the
# projection tests exercise the leiden path.
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx2>=2.0",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    # The linter Phase 6's exit review recorded the absence of (T78a). It is a
    # dev dependency because nothing at runtime imports it; CI runs it in the
    # fast-tests job, beside the suite whose defects it exists to pre-empt.
    "ruff>=0.14",
]

[project.urls]
Repository = "https://github.com/drex7001/Aegis"

[project.scripts]
aegis = "aegis.cli:app"

# Only the platform core is packaged; the legacy prototype (legacy/) lives
# beside it until Phase 4 replaces and deletes it (ADR-023 — replace, never extend).
[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
xfail_strict = true
markers = [
    "unit: isolated test with no process or service boundary",
    "component: in-process API or CLI test with replaced external boundaries",
    "contract: schema, ontology, API, or governance invariant",
    "integration: requires the dedicated PostgreSQL test database",
    "system: requires the real compose service stack",
    "e2e: browser-driven end-to-end workflow",
    "requirement(*ids): maps a test to constitution, spec, ADR, or task identifiers",
    "slow: intentionally long-running test",
    "manual: operator-run non-blocking test",
]

# ── ruff (T78a) ─────────────────────────────────────────────────────────────
#
# The linter the Phase 6 exit review recorded the absence of. Its first run
# found `aegis migrate arrests-to-events` raising `NameError` on two names the
# function never imported — a command that shipped in Phase 5 with tests that
# call the library function directly and never the CLI entry point.
#
# The initial ruleset is deliberately **defect-shaped rather than style-shaped**.
# A linter that arrives with a thousand cosmetic findings gets a blanket ignore
# on its second day, and the rules that would have caught a real bug go with it.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "legacy",                    # the quarantine: replaced, never extended (ADR-023)
    "aegis/actions/_generated",  # `aegis ontology generate` owns these bytes; a
                                 # lint fix here is reverted by the drift gate
]

[tool.ruff.lint]
# E4/E7/E9 + F is pyflakes plus the pycodestyle rules that are not formatting.
# F821 (undefined name) is the one this exists for.
select = ["E4", "E7", "E9", "F"]

# Rules considered and **not** enabled yet, each with its reason. Widening the
# set is a task of its own, so that a formatting diff never rides along with a
# feature:
#
#   E501 line-too-long   — 53 lines over 100 chars, every one of them prose in a
#                          docstring. Reflowing them touches files this repo
#                          reasons about by reading; not for free.
#   I001 unsorted-imports — 65 files reordered, zero defects found. It becomes
#                          worthwhile the day a formatter lands with it.
#   B008 function-call-in-default-argument — 183 hits, all of them FastAPI's
#                          `Depends(...)`, which is the framework's documented
#                          calling convention rather than a mistake.
#   UP017 datetime-timezone-utc — 57 mechanical rewrites of `timezone.utc`.
#                          Correct, and worth doing on its own commit.
#   SIM, RUF, C4, UP (rest) — style opinions. Some are good; none of them is a
#                          bug, and this file is arguing that the difference
#                          matters.
[tool.ruff.lint.per-file-ignores]
# pytest resolves a fixture by parameter name, so a test module that imports a
# fixture and then names it in a signature looks to pyflakes like a redefinition
# of an unused import. It is the framework working as designed, 112 times.
"tests/**" = ["F811"]

[tool.coverage.run]
branch = true
source = ["aegis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"
