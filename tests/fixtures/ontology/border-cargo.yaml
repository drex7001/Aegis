# border-cargo — a second, entirely fictional domain module (T31, Article XIV).
#
# This module exists to be *proof*, not product. It is the executable form of
# "domains are ontology modules": the core loads it, validates claims against
# it, and projects a graph from it without a single file under `aegis/`
# mentioning a consignment or a port. `test_second_domain.py` fails if one ever
# does.
#
# Deliberately unlike criminal-network — different object types, different
# predicates, no person — so that passing cannot be an accident of the two
# domains overlapping.

module:
  name: border_cargo
  namespace: test/border-cargo
  version: 1.2.0
  label: Border cargo (fixture domain)
  #
  # 1.2.0 (T51): `vessel` — a type added *after* the generic screens existed,
  #              which is what makes it a proof rather than a fixture that
  #              happened to be there first.
  imports:
    # Load-bearing, not decorative: `port_of_entry.code` declares a
    # sensitivity, `consignment` implements a platform interface and
    # references a platform shared property, and all three are owned by
    # platform. Delete this import and the composition fails with a precise
    # error (spec 08 §2.3).
    - module: platform
      version: ">=1.2.0,<2.0.0"

categories:
  customs: {label: Customs, color: "#00695c"}

object_types:
  consignment:
    label: Consignment
    # A domain module implementing an interface it does not own — the whole
    # point of ADR-041. Under the `members:` design this line would have been
    # impossible without editing the platform module.
    implements: [identifiable]
    properties:
      reference:   {shared: registered_identifier, required: true}
      description: {shared: notes}
    display: {title: reference, subtitle: description}

  port_of_entry:
    label: Port of entry
    properties:
      name: {type: text, required: true}
      code: {type: identifier, sensitivity: restricted}
    display: {title: name, subtitle: code}

  # T51's proof type. Added after `ObjectTypeView`, `ObjectView` and the rail
  # already existed, and deliberately exercising every field a generic screen
  # reads: a `display` with a subtitle, a `required` property, a `many`
  # property, a `restricted` one, a `conflicts: preserve` one, and a shared
  # reference. If a screen needed a line of React for any of them, this type is
  # where it would show.
  vessel:
    label: Vessel
    implements: [identifiable]
    properties:
      name:        {type: text, required: true}
      imo_number:  {shared: registered_identifier, label: IMO number}
      former_names: {shared: alias}
      # Two sources may disagree about a flag and both stand — the same rule
      # `person.date_of_birth` relies on, in a domain the core has never seen.
      flag_state:  {type: text, conflicts: preserve}
      notes:       {shared: notes}
    display: {title: name, subtitle: former_names}

predicates:
  # A literal-object predicate: what the paperwork said the cargo was.
  declared_as:      {subject: [consignment], object: literal, category: customs}
  # An entity-object predicate, so the edge projection has something to build.
  cleared_at:       {subject: [consignment], object: [port_of_entry], category: customs}
  # An identifier predicate, so the deterministic ER rules pick this domain up
  # without knowing anything about bills of lading (spec 05 §3.1).
  manifested_under: {subject: [consignment], object: literal, identifier: true, category: customs}
  # A link *onto* the new type and one *from* it, so its object view has both
  # directions to group and the rail has somewhere to lead.
  carried_on:       {subject: [consignment], object: [vessel], category: customs}
  berthed_at:       {subject: [vessel], object: [port_of_entry], category: customs}
